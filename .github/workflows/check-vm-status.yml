name: Check VM Madrid Status

on:
  # Toutes les 10 minutes — vérifie l'état des VMs sans rien créer
  schedule:
    - cron: '*/10 * * * *'
  # Lancement manuel depuis l'UI GitHub Actions
  workflow_dispatch:
  # Déclenché par le .bat local (repository_dispatch)
  repository_dispatch:
    types: [check-vm]

permissions:
  contents: write  # pour commit vm-status.json
  actions: read

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCI SDK
        run: pip install oci

      - name: Check VM status
        id: check
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: eu-madrid-1
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          STATUS_OUTPUT=vm-status.json python3 check-vm-status.py
        continue-on-error: true

      - name: Show generated status
        if: always()
        run: |
          echo "=== vm-status.json (extrait) ==="
          if [ -f vm-status.json ]; then
            cat vm-status.json
            echo ""
            echo "=== Resume ==="
            python3 -c "
          import json
          try:
              d = json.load(open('vm-status.json'))
              print(f\"user: {d.get('summary',{}).get('user')}\")
              print(f\"user_email: {d.get('summary',{}).get('user_email')}\")
              print(f\"region: {d.get('region')}\")
              print(f\"instances: {d.get('summary',{}).get('instance_count',0)}\")
              print(f\"running: {d.get('summary',{}).get('running_count',0)}\")
              print(f\"vm_madrid_exists: {d.get('summary',{}).get('vm_madrid_exists')}\")
              for i in d.get('instances', []):
                  print(f\"  - {i.get('display_name')} | {i.get('lifecycle_state')} | AD={i.get('availability_domain')} | IP={i.get('public_ip','?')}\")
              for v in d.get('volumes', []):
                  print(f\"  vol: {v.get('display_name')} | {v.get('size_gb')}GB | {v.get('lifecycle_state')}\")
              if d.get('errors'):
                  print('ERREURS:')
                  for e in d['errors']:
                      print(f'  - {e[:120]}')
          except Exception as e:
              print(f'erreur lecture: {e}')
          "
          else
            echo "(vm-status.json non genere)"
          fi

      - name: Upload status as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-status
          path: vm-status.json
          retention-days: 7
        continue-on-error: true

      # Pas de commit du JSON dans le repo : 144 commits/jour = pollution.
      # Le statut est visible dans le log "Show generated status" + artifact "vm-status".

      - name: Notify ntfy if VM is RUNNING
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ ! -f vm-status.json ]; then
            echo "vm-status.json absent, pas de notif"
            exit 0
          fi
          EXISTS=$(python3 -c "import json; print(json.load(open('vm-status.json')).get('summary',{}).get('vm_madrid_exists', False))")
          if [ "$EXISTS" = "True" ] && [ -n "$NTFY_TOPIC" ]; then
            IP=$(python3 -c "import json; d=json.load(open('vm-status.json')); ms=[i for i in d.get('instances',[]) if i.get('display_name')=='jarvis-madrid' and i.get('public_ip')]; print(ms[0]['public_ip'] if ms else 'NO_IP')")
            curl -s -H "Title: VM Madrid RUNNING" \
              -d "VM Madrid creee et accessible. IP: $IP" \
              "https://ntfy.sh/${NTFY_TOPIC}"
            echo "Notif envoyee"
          else
            echo "VM pas encore creee, pas de notif"
          fi
        continue-on-error: true