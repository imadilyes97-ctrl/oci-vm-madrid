name: Create VM Madrid
on:
  schedule:
    - cron: '*/5 * * * *'  # Toutes les 5 minutes
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-vm]        # Lancement manuel

# PAS de concurrency cancel-in-progress — c'est ce qui tuait les runs !
# Le script a deja sa propre protection anti-suspension (1 tentative/run, circuit breaker)
jobs:
  create-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCI SDK
        run: pip install oci

      - name: Create VM
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: eu-madrid-1
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 create-vm.py

      - name: Log run info
        if: always()
        run: |
          echo "=== RUN INFO ==="
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Event: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run number: ${{ github.run_number }}"

      - name: Notify on failure (optional)
        if: failure()
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -d "VM Madrid: tentative echouee (see logs)" \
              "https://ntfy.sh/${NTFY_TOPIC}" || true
          fi
